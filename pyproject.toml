[project]
name = "crow-server"
version = "0.0.0"
description = "CROW-Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.4",
    "psycopg2>=2.9.12",
    "sqlalchemy>=2.0.49",
    "websocket>=0.2.1",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.20.2",
  "ruff>=0.15.12",
  "pre-commit>=4.6.0",
  "build>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.setuptools.packages.find]
where = ["src"]
