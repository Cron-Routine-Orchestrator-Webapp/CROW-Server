[project]
name = "crow-server"
version = "0.0.1"
description = "CROW-Server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0.5",
    "psycopg2>=2.9.12",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "sqlalchemy>=2.0.49",
    "websocket>=0.2.1",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=2.1.0",
  "ruff>=0.15.14",
  "pre-commit>=4.6.0",
  "build>=1.5.0",
]

[project.scripts]
server = "server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.setuptools.packages.find]
where = ["src"]
