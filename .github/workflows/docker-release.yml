name: Build & Release

on:
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/cron-routine-orchestrator-webapp/crow-server:${{ github.event.release.tag_name }} \
            -t ghcr.io/cron-routine-orchestrator-webapp/crow-server:latest \
            .

      - name: Push image
        run: |
          docker push ghcr.io/cron-routine-orchestrator-webapp/crow-server:${{ github.event.release.tag_name }}
          docker push ghcr.io/cron-routine-orchestrator-webapp/crow-server:latest

  artifacts:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upload compose + install script
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docker-compose.yml