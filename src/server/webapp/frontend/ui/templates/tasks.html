<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CROW - Task Manager</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">

    <style>

        body {
            color: black;
        }

        .task-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input,
        select,
        textarea,
        button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2980b9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th,
        table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        @media(max-width: 900px) {

            .task-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>
<body>

<header>
    CROW - Task Manager
</header>

<nav>
    <a href="/">Dashboard</a>
    <a href="/jobs">Jobs</a>
    <a href="/tasks">Tasks</a>
    <a href="/clients">Clients</a>
</nav>

<div class="container">

    <div class="task-grid">

        <!-- TASK ERSTELLEN -->
        <div class="card">

            <h2>Neue Task erstellen</h2>

            <form method="post">

                {% csrf_token %}

                <!-- TASK ID -->
                <label>Task ID</label>

                <input
                    type="text"
                    name="id"
                    placeholder="z.B. backup_task"
                    required
                >

                <!-- JOB TYPE -->
                <label>Job Typ</label>

                <select name="job_type" id="job_type">

                    <option value="python">
                        Python Script
                    </option>

                    <option value="command">
                        Command
                    </option>

                    <option value="shell_command">
                        Shell Command
                    </option>

                </select>

                <!-- PARAMETERS -->
                <label>Parameter</label>

                <textarea
                    name="parameters"
                    rows="6"
                    placeholder="z.B. python3 backup.py oder ipconfig /all"
                ></textarea>

                <button type="submit">
                    Task speichern
                </button>

            </form>

        </div>

        <!-- TASK LISTE -->
        <div class="card">

            <h2>Vorhandene Tasks</h2>

            <table>

                <thead>

                    <tr>
                        <th>ID</th>
                        <th>Typ</th>
                        <th>Parameter</th>
                        <th>Erstellt</th>
                    </tr>

                </thead>

                <tbody>

                    {% for task in tasks %}

                    <tr>

                        <!-- ID -->
                        <td>
                            {{ task.id }}
                        </td>

                        <!-- TYPE -->
                        <td>
                            {{ task.job_type }}
                        </td>

                        <!-- PARAMETERS -->
                        <td>
                            {{ task.parameters }}
                        </td>

                        <!-- CREATED -->
                        <td>
                            {{ task.created_at }}
                        </td>

                    </tr>

                    {% empty %}

                    <tr>

                        <td colspan="4">
                            Keine Tasks vorhanden
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
