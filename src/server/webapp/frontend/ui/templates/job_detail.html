<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>{{ job.id }}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="/static/styles.css" />

    <style>
      body {
        margin: 0;
        color: black;
        background: #f5f6fa;
        font-family: Arial, sans-serif;
      }

      /* HEADER / NAV */
      header {
        background: #2f3640;
        color: white;
        padding: 15px 20px;
        font-size: 20px;
      }

      nav {
        background: #353b48;
        padding: 10px 20px;
      }

      nav a {
        color: #dcdde1;
        margin-right: 15px;
        text-decoration: none;
        font-size: 14px;
      }

      nav a:hover {
        color: white;
      }

      /* LAYOUT */
      .container {
        padding: 20px;
      }

      /* CARD */
      .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }

      /* BADGES */
      .badge {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
        color: white;
        display: inline-block;
      }

      .active {
        background: #2ecc71;
      }

      .stopped {
        background: #e74c3c;
      }

      /* META GRID */
      .meta-grid {
        display: grid;
        grid-template-columns: 140px 1fr;
        gap: 8px;
        margin-top: 10px;
        font-size: 14px;
      }

      /* BUTTONS */
      .btn-row {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }

      .btn {
        border: none;
        padding: 10px 16px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        text-decoration: none;
        font-size: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-back {
        background: #3498db;
        color: white;
      }

      .btn-back:hover {
        background: #2980b9;
      }

      .btn-delete {
        background: #e74c3c;
        color: white;
      }

      .btn-delete:hover {
        background: #c0392b;
      }

      /* TYPO */
      h2 {
        margin-top: 0;
      }

      .page-title {
        font-size: 22px;
        font-weight: bold;
      }
      /* SWITCH */

      .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }

      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;

        cursor: pointer;

        top: 0;
        left: 0;
        right: 0;
        bottom: 0;

        background-color: #ccc;

        transition: 0.2s;

        border-radius: 34px;
      }

      .slider:before {
        position: absolute;

        content: "";

        height: 26px;
        width: 26px;

        left: 4px;
        bottom: 4px;

        background-color: white;

        transition: 0.2s;

        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: #2ecc71;
      }

      input:checked + .slider:before {
        transform: translateX(26px);
      }
    </style>
  </head>

  <body>
    <header><a href="/">CROW</a> - Job Viewer</header>

    <nav>
      <a href="/">Dashboard</a>
      <a href="/jobs">Jobs</a>
      <a href="/tasks">Tasks</a>
      <a href="/clients">Clients</a>
      <a href="/calendar">Kalender</a>
    </nav>

    <div class="container">
      <!-- JOB INFO -->
      <div class="card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <div class="page-title">Job {{ job.id }}</div>

          {% if job.enabled %}
          <span class="badge active"> Aktiv </span>
          {% else %}
          <span class="badge stopped"> Deaktiviert </span>
          {% endif %}
        </div>

        <div class="meta-grid">
          <div><b>ID</b></div>
          <div>{{ job.id }}</div>

          <div><b>Task</b></div>
          <div>{{ job.task_id }}</div>

          <div><b>Client</b></div>
          <div>{{ job.client_id }}</div>

          <div><b>Aktiv</b></div>
          <div>{{ job.enabled }}</div>
        </div>

        <!-- ACTIONS -->
        <div class="btn-row">
          <a href="/jobs" class="btn btn-back"> ← Zurück </a>

          <form
            method="post"
            onsubmit="return confirm('Willst du diesen Job wirklich löschen?');"
          >
            {% csrf_token %}

            <button
              type="submit"
              name="delete_job"
              value="true"
              class="btn btn-delete"
            >
              Job löschen
            </button>
          </form>
        </div>
        <form method="post">
          {% csrf_token %}

          <input type="hidden" name="toggle_enabled" value="true" />

          <input
            type="hidden"
            name="enabled"
            value="{% if job.enabled %}false{% else %}true{% endif %}"
          />

          <label class="switch">
            <input
              type="checkbox"
              {%
              if
              job.enabled
              %}checked{%
              endif
              %}
              onchange="this.form.submit()"
            />

            <span class="slider"></span>
          </label>
        </form>
      </div>
    </div>
  </body>
</html>
